name: todo
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  freezed: ^2.5.8
  bloc: ^8.1.4
  dartz: ^0.10.1
  flutter_bloc: ^8.1.6
  flutter_slidable: ^4.0.3
  dio: ^5.5.0
  intl: ^0.20.2
  drift: ^2.28.2
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.1
  auto_route: ^10.3.0
  get_it: ^7.7.0
  equatable: ^2.0.5
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^10.2.3
  build_runner: ^2.5.4
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: SFProTextSemiBold
      fonts:
        - asset: assets/fonts/SFProText-Semibold.ttf
    - family: SFProTextRegular
      fonts:
        - asset: assets/fonts/SFProText-Regular.ttf
    - family: SFProTextMedium
      fonts:
        - asset: assets/fonts/SFProText-Medium.ttf